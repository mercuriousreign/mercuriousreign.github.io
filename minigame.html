<html>
  <head>
    <title>Chronicles of MercuryRaven</title>
    <link rel="stylesheet" href="style.css" />
    <script src="game.js" defer></script>
  </head>
  <div id="game">
    <div id="scoreplace">
      <h3>Scoring <b id="scoring"></b></h3>
      <h3>HP <b id="HP"></b></h3>
    </div>
    <div
      id="player2"
      style="
        position: absolute;
        background-color: blue;
        width: 72px;
        height: 72px;
      "
    ></div>
    <div id="player">
      <img
        id="player_sprite"
        src="img/sprite-stand.gif"
        alt="Thumbnail of MercuryRaven"
      />
    </div>
    <div id="player3" style="position: absolute; filter: hue-rotate(295deg)">
      <img
        id="player3.3"
        src="img/sprite-stand.gif"
        alt="Thumbnail of MercuryRaven"
      />
    </div>
  </div>
</html>
